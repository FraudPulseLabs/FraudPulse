<div class="login min-h-screen bg-neutral-950 text-neutral-100 antialiased">

  <header class="border-b border-neutral-800/60">
    <div class="mx-auto flex h-16 max-w-6xl items-center px-6 lg:px-8">
      <a routerLink="/" class="flex items-center gap-2.5 no-underline">
        <span
          class="flex h-7 w-7 items-center justify-center rounded-sm bg-neutral-100 text-[10px] font-bold tracking-tighter text-neutral-950"
          aria-hidden="true"
        >FP</span>
        <span class="text-sm font-semibold tracking-tight text-neutral-100">FraudPulse</span>
      </a>
    </div>
  </header>

  <main class="flex flex-1 items-center justify-center px-6 py-20">
    <div class="login-card w-full max-w-md">

      <div class="login-card__header">
        <p class="type-label">Secure access</p>
        <h1 class="login-card__title">Sign in</h1>
        <p class="login-card__subtitle">
          Enter your credentials to access the risk operations workspace.
        </p>
      </div>

      <form (ngSubmit)="submit()" class="login-form">
        <div class="login-field">
          <label for="email" class="type-label">Email</label>
          <input
            id="email"
            type="email"
            name="email"
            autocomplete="email"
            required
            placeholder="you@company.com"
            class="fp-field-input"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
          />
        </div>

        <div class="login-field">
          <label for="password" class="type-label">Password</label>
          <div class="password-input-wrap">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              name="password"
              autocomplete="current-password"
              required
              placeholder="••••••••"
              class="fp-field-input password-input"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
            />
            <button
              type="button"
              class="password-toggle"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
              [attr.aria-pressed]="showPassword()"
              (click)="togglePasswordVisibility()"
            >
              @if (showPassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                </svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              }
            </button>
          </div>
        </div>

        @if (error()) {
          <p class="login-error" role="alert">{{ error() }}</p>
        }

        <button type="submit" class="cta-solid login-submit" [disabled]="loading()">
          {{ loading() ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>

      <p class="login-footer">
        <a routerLink="/" class="login-footer__link">← Back to FraudPulse</a>
      </p>

    </div>
  </main>

</div>
