name: Keep Supabase awake

# The Supabase free tier pauses a project after ~7 days without activity, which
# would silently kill the live demo. This runs every 2 days to stay well inside
# that window even if GitHub delays a scheduled run.
#
# Two different signals, because they exercise different paths:
#   1. PostgREST  — a request through Supabase's own API gateway.
#   2. /health/db — the backend opening a real Postgres connection (SELECT 1).
#
# NOTE: GitHub disables scheduled workflows after 60 days of repository
# inactivity. This is a backstop, not the primary keep-alive — the UptimeRobot
# monitor on /health/db runs every 5 minutes and has no such rule.

on:
  schedule:
    # Off-peak minute: on-the-hour crons queue behind everyone else's.
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Postgres through the Supabase API gateway
        env:
          # Repository variable, not a secret — the project URL already ships
          # in the frontend bundle. Settings -> Secrets and variables ->
          # Actions -> Variables -> SUPABASE_URL
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.BACKEND_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SERVICE_KEY}" ]; then
            echo "::error::SUPABASE_URL variable or BACKEND_SUPABASE_SERVICE_ROLE_KEY secret is not set."
            exit 1
          fi
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/transactions?select=id&limit=1" \
            -H "apikey: ${SERVICE_KEY}" \
            -H "Authorization: Bearer ${SERVICE_KEY}")
          echo "PostgREST responded HTTP ${code}"
          # Body is a row id at most; safe to echo, and useful when debugging.
          cat /tmp/body; echo
          [ "${code}" = "200" ]

      - name: Backend database readiness
        run: |
          set -euo pipefail
          curl -fsS https://fraudpulse.duckdns.org/health/db | tee /tmp/health
          grep -q '"database":"ok"' /tmp/health
