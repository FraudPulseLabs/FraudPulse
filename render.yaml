services:
  - type: web
    name: frontend
    runtime: node
    rootDir: frontend
    buildFilter:
      paths:
        - frontend/**
    buildCommand: npm ci && npm run build:prod
    staticPublishPath: dist/fraudpulse/browser
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
