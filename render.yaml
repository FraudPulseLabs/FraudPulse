services:
  - type: web
    name: frontend
    runtime: node
    rootDir: frontend
    buildFilter:
      paths:
        - frontend/**
    buildCommand: npm ci && npm run build:prod
    staticPublishPath: dist/fraudpulse/browser
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # FastAPI backend incl. the RAG assistant. Built from backend/Dockerfile,
  # which installs the RAG deps, pre-caches the embedding model, and ships the
  # prebuilt vector index under rag/index. Set the secret env vars in the
  # Render dashboard (they are sync:false so they are never committed).
  - type: web
    name: backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
